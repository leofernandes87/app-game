<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<wicket:extend>

    <!-- Feedback local da página -->
    <div wicket:id="localFeedback" style="margin-bottom:12px;"></div>

    <!-- URL do long-poll injetada pela page -->
    <span id="eventsUrl" wicket:id="eventsUrl" style="display:none"></span>

    <!-- Filtros -->
    <form wicket:id="filtrosForm" id="filtrosFormDom" style="display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:16px;">
        <div style="display:flex;flex-direction:column;gap:6px;">
            <label for="status">Status</label>
            <select wicket:id="status" id="status" style="padding:6px 8px;border:1px solid #ccc;border-radius:6px;min-width:200px;"></select>
        </div>

        <div style="display:flex;flex-direction:column;gap:6px;">
            <label for="de">De (data/hora)</label>
            <input wicket:id="de" id="de" style="padding:6px 8px;border:1px solid #ccc;border-radius:6px;">
        </div>

        <div style="display:flex;flex-direction:column;gap:6px;">
            <label for="ate">Até (data/hora)</label>
            <input wicket:id="ate" id="ate" style="padding:6px 8px;border:1px solid #ccc;border-radius:6px;">
        </div>

        <div style="display:flex;gap:8px;">
            <button type="submit"
                    style="padding:8px 14px;border:none;border-radius:6px;background:#003366;color:#fff;cursor:pointer;">
                Filtrar
            </button>
            <button wicket:id="limpar" type="submit"
                    style="padding:8px 14px;border:1px solid #ccc;border-radius:6px;background:#fff;cursor:pointer;">
                Limpar
            </button>
        </div>
    </form>

    <!-- Tabela -->
    <table style="width:100%;border-collapse:collapse;">
        <thead>
        <tr style="background:#f4f6f9;">
            <th style="text-align:left;padding:10px;border-bottom:1px solid #e5e7eb;">ID</th>
            <th style="text-align:left;padding:10px;border-bottom:1px solid #e5e7eb;">Time A</th>
            <th style="text-align:left;padding:10px;border-bottom:1px solid #e5e7eb;">Time B</th>
            <th style="text-align:left;padding:10px;border-bottom:1px solid #e5e7eb;">Data/Hora</th>
            <th style="text-align:left;padding:10px;border-bottom:1px solid #e5e7eb;">Placar</th>
            <th style="text-align:left;padding:10px;border-bottom:1px solid #e5e7eb;">Status</th>
        </tr>
        </thead>
        <tbody>
        <!-- Cada <tr> é um item do ListView -->
        <tr wicket:id="rows">
            <td wicket:id="id"    style="padding:10px;border-bottom:1px solid #eee;"></td>
            <td wicket:id="timeA" style="padding:10px;border-bottom:1px solid #eee;"></td>
            <td wicket:id="timeB" style="padding:10px;border-bottom:1px solid #eee;"></td>
            <td wicket:id="dataHora" style="padding:10px;border-bottom:1px solid #eee;"></td>
            <td wicket:id="placar" style="padding:10px;border-bottom:1px solid #eee;"></td>
            <td wicket:id="status" style="padding:10px;border-bottom:1px solid #eee;"></td>
        </tr>
        </tbody>
    </table>
    <!--script do long pool-->
    <script>
        /**
         * Loop de long-poll:
         * - Mantém uma conexão aberta com /api/events/long-poll.
         * - Se o servidor responder 200 (chegou evento), paramos o loop e submetemos o formulário de filtros
         *   para recarregar a listagem.
         * - Se responder 204 (timeout sem evento), reconectamos imediatamente (sem “espera”).
         * - Em erros/4xx/5xx aplicamos backoff exponencial até 5s.
         * - Não disparamos requisição se já houver uma em voo (inflight) ou se a aba estiver oculta.
         */
        (function () {
            // Lê a URL do endpoint (injetada pela página via wicket:id="eventsUrl")
            const url = (document.getElementById('eventsUrl').textContent||'').trim();
            if (!url) return;

            // Controle do loop:
            // - inflight: evita paralelismo de requisições
            // - stopped: flag para encerrar definitivamente o loop
            // - backoff: intervalo (ms) entre tentativas em caso de erro
            let inflight = false, stopped = false, backoff = 250;

            // Agenda a próxima iteração do loop, se o loop não tiver sido parado
            function schedule(ms){ if(!stopped) setTimeout(poll, ms); }

            // Uma iteração do long-poll
            function poll(){
                // Não tenta se:
                // - já paramos (stopped)
                // - já existe uma requisição em andamento (inflight)
                // - a aba está em background (document.hidden) -> poupa recursos
                if (stopped || inflight || document.hidden) { schedule(500); return; }
                inflight = true; // liberamos para nova tentativa

                fetch(url, { method:'GET', cache:'no-store' })
                    .then(res => {
                        inflight = false;
                        // 204 = timeout sem evento → reconecta imediatamente (sem backoff)
                        if (res.status === 204) { backoff = 250; schedule(0); return; }
                        if (res.ok) {
                            // 200 = chegou evento → paramos o loop e submetemos o form para recarregar a lista
                            stopped = true;
                            document.getElementById('filtrosFormDom')?.submit();
                            return;
                        }
                        // Para quaisquer outros status (4xx/5xx), aplicamos backoff exponencial até 5s
                        backoff = Math.min(backoff*2, 5000);
                        schedule(backoff);

                        // Backoff é esperar um tempo antes de tentar de novo quando algo falha.
                        // Evita tempestade de requisições quando o servidor ou a rede estão instáveis.
                        // Se você re-tentar na mesma velocidade, só piora a sobrecarga.
                        // Dá tempo para o serviço se recuperar (ex.: restart do WildFly, queda do Rabbit, DNS)
                        // Diminui custo no cliente e no servidor (CPU, logs, rate limits).
                    })
                    // Erro de rede → backoff exponencial igual ao caso de erro HTTP
                    .catch(() => { inflight = false; backoff = Math.min(backoff*2, 5000); schedule(backoff); });
            }
            // Quando a aba volta ao foco, fazemos uma tentativa rápida
            document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) schedule(100); });

            // Disparo inicial imediato do loop
            schedule(0);
        })();
    </script>

</wicket:extend>
</html>
