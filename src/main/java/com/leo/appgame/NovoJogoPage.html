<!DOCTYPE html>
<html lang="pt-br" xmlns:wicket="http://wicket.apache.org">
<head>
    <meta charset="UTF-8">
    <title>Novo Jogo</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 24px; }
        form { max-width: 560px; display: grid; gap: 12px; }
        label { font-weight: 600; }
        input, select, button { padding: 8px 10px; font-size: 14px; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    </style>
</head>
<body>
<h1>Cadastrar Jogo</h1>

<div wicket:id="feedback"></div>

<form wicket:id="form">
    <div class="row">
        <div>
            <label for="timeA">Time A</label>
            <input wicket:id="timeA" id="timeA" type="text" placeholder="Time A">
        </div>
        <div>
            <label for="timeB">Time B</label>
            <input wicket:id="timeB" id="timeB" type="text" placeholder="Time B">
        </div>
    </div>

    <div class="row">
        <div>
            <label for="placarA">Placar A</label>
            <input wicket:id="placarA" id="placarA" type="number" min="0" value="0">
        </div>
        <div>
            <label for="placarB">Placar B</label>
            <input wicket:id="placarB" id="placarB" type="number" min="0" value="0">
        </div>
    </div>

    <div class="row">
        <div>
            <label for="status">Status</label>
            <select wicket:id="status" id="status"></select>
        </div>
        <div>
            <label for="dataHora">Data/Hora</label>
            <input wicket:id="dataHora" id="dataHora" type="text" placeholder="28-08-2025T20:00">
        </div>
    </div>

    <button wicket:id="salvar" type="submit">Salvar</button>
</form>
</body>
</html>
