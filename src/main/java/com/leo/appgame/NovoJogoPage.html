<html xmlns:wicket="http://www.w3.org/1999/xhtml">
<head></head>
<body>
<wicket:extend>
    <h1>Cadastrar Jogo</h1>

    <form wicket:id="form" style="max-width: 560px; display: grid; gap: 12px; font-family: system-ui, sans-serif;">
        <div class="row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div>
                <label for="timeA" style="font-weight: 600;">Time A</label>
                <input wicket:id="timeA" id="timeA" type="text" placeholder="Time A" style="padding: 8px 10px; font-size: 14px; width: 100%;">
            </div>
            <div>
                <label for="timeB" style="font-weight: 600;">Time B</label>
                <input wicket:id="timeB" id="timeB" type="text" placeholder="Time B" style="padding: 8px 10px; font-size: 14px; width: 100%;">
            </div>
        </div>

        <div class="row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div>
                <label for="placarA" style="font-weight: 600;">Placar A</label>
                <input wicket:id="placarA" id="placarA" type="number" min="0" value="0" style="padding: 8px 10px; font-size: 14px; width: 100%;">
            </div>
            <div>
                <label for="placarB" style="font-weight: 600;">Placar B</label>
                <input wicket:id="placarB" id="placarB" type="number" min="0" value="0" style="padding: 8px 10px; font-size: 14px; width: 100%;">
            </div>
        </div>

        <div class="row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div>
                <label for="status" style="font-weight: 600;">Status</label>
                <select wicket:id="status" id="status" style="padding: 8px 10px; font-size: 14px; width: 100%;"></select>
            </div>
            <div>
                <label for="dataHora" style="font-weight: 600;">Data/Hora</label>
                <input wicket:id="dataHora" id="dataHora" type="text" style="padding: 8px 10px; font-size: 14px; width: 100%;">
            </div>
        </div>

        <button wicket:id="salvar" type="submit"
                style="padding: 10px 16px; background: #007acc; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; justify-self: start;">
            Salvar
        </button>
    </form>
</wicket:extend>
</body>
</html>
